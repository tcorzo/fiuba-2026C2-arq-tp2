- name: Setup VMSS nodes
  hosts: all
  gather_facts: yes
  vars:
    datadog_api_key: "{{ lookup('env', 'DATADOG_API_KEY') }}"
    # The site follows the API key's account: datadoghq.com, us5.datadoghq.com, ...
    # No default on purpose: a key sent to the wrong site fails without a visible error.
    datadog_site: "{{ lookup('env', 'DATADOG_SITE') }}"

  pre_tasks:
    - name: Require the Datadog API key and site
      assert:
        that:
          - datadog_api_key | length > 0
          - datadog_site | length > 0
        fail_msg: "Set DATADOG_API_KEY and DATADOG_SITE (e.g. us5.datadoghq.com) first."
      run_once: yes

  tasks:
    - name: Import Datadog Agent role from collection
      import_role:
        name: datadog.dd.agent
      become: yes
    - name: Install unzip
      apt:
        name: unzip
        state: present
      become: yes
    - name: Install node
      shell: |
        sudo apt-get update
        sudo apt-get install -y ca-certificates curl gnupg
        sudo mkdir -p /etc/apt/keyrings
        curl https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
        NODE_MAJOR=24
        echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_$NODE_MAJOR.x nodistro main" | sudo tee /etc/apt/sources.list.d/nodesource.list
        sudo apt-get update
        sudo apt-get install nodejs -y
      args:
        creates: /usr/bin/node
      become: yes
    - name: Install pm2
      command: npm install pm2@latest -g
      become: yes
