- name: Update app
  hosts: all
  gather_facts: yes
  tasks:
    - name: Stop old version
      command: pm2 stop server.js
      ignore_errors: yes
    - name: Extract new version
      unarchive:
        src: ../node/src.zip
        dest: ~/.
        owner: azureuser
        group: azureuser
    - name: Install dependencies
      command: npm ci
    - name: Start new version
      command: pm2 start server.js