# Hygiene, secrets and formatters. Conventional-commit enforcement lives in CI
# (.github/workflows/pr-title.yml), on the PR title that becomes the merge
# commit subject — individual commit messages are not checked here.
#
# Install once:  mise run setup   (runs `prek install`)
# Run manually:  mise run lint
#
# The whitespace fixers skip, on purpose:
#   README.md                — the assignment, kept as the course ships it.
#   perf/results/            — raw Artillery reports. The evidence has to be
#                              byte for byte what the run wrote.
#   evidencia/               — the same, for terraform/az outputs and log
#                              extracts.
#   docs/diagramas/*.svg|png — rendered by `mise run diagrams`.
# The secrets hooks run on everything: evidence is where a key leaks from.

repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v5.0.0
      hooks:
          - id: trailing-whitespace
            exclude: &raw-output ^(README\.md$|perf/results/|evidencia/|docs/diagramas/.*\.(svg|png)$)
          - id: end-of-file-fixer
            exclude: *raw-output
          - id: mixed-line-ending
            exclude: *raw-output
          - id: check-merge-conflict
          - id: check-added-large-files
          - id: check-yaml
            # Artillery scenarios, Ansible playbooks, evidencia.yml
          - id: check-json
          - id: detect-private-key
            # key.pem is gitignored, but a copy under another name is not.

    - repo: local
      hooks:
          # The README is explicit: these files hold API keys or the state with
          # secrets in plain text, and a committed key has to be revoked.
          # .gitignore already skips them; this catches a `git add -f`.
          - id: forbid-secret-files
            name: forbid terraform state, tfvars and private keys
            entry: these files hold secrets and must never be committed (README, Setup)
            language: fail
            files: (\.tfvars|\.tfstate(\..*)?|\.pem|(^|/)ddog_api_key)$

          # Scans the staged diff for API keys and tokens. Pinned in mise.toml.
          - id: gitleaks
            name: gitleaks
            entry: gitleaks git --pre-commit --staged --redact --no-banner
            language: system
            pass_filenames: false
            always_run: true

          # Several people edit the same .typ files. Formatting them
          # mechanically keeps the diffs about what the report says.
          - id: typstyle
            name: typstyle
            entry: typstyle --inplace
            language: system
            files: \.typ$

          - id: terraform-fmt
            name: terraform fmt
            entry: terraform fmt
            language: system
            files: \.tf$
