config:
  environments:
    api:
      target: 'https://localhost:5555'
      plugins:
        statsd:
          host: localhost
          port: 8125
          prefix: "artillery-api"

  # H-38: nginx serves a self-signed lab certificate (`mise run certs`).
  tls:
    rejectUnauthorized: false

  pool: 50 # All HTTP requests from all virtual users will be sent over the same connections

  phases:
    - name: Ramp
      duration: 30
      arrivalRate: 1
      rampTo: 5
    - name: Plain
      duration: 60
      arrivalRate: 5
    - name: Quiet
      duration: 30
      arrivalRate: 0


scenarios:
  - name: Rates (/rates)
    flow:
      - get:
          url: '/rates'
