[tools]
# Infra. terraform must match `required_version` in each stack's terraform.tf.
terraform = "1.17.1"
tflint = "0.64.0"
azure-cli = "2.91.0"
ansible-core = "2.21.5"

# Node app + Artillery. Major matches NODE_MAJOR in ansible/vmss_setup.yml
node = "24.22.2"

# Backend for the pypi: tools above (azure-cli, ansible-core)
uv = "0.13.6"

# Pre-commit hook manager (drop-in for pre-commit, no Python install needed).
prek = "0.5.9"
# The evidence goes in git, and Terraform and Artillery outputs are where an
# API key leaks from. The pre-commit hook scans every staged change.
gitleaks = "8.30.1"
# The report is written in Typst; `typstyle` formats it from the lint hook, so
# the .typ sources never diverge on whitespace between authors.
typst = "0.15.1"
typstyle = "0.15.1"
# node/zip.sh builds the app archive app:deploy ships. Info-ZIP's zip has no
# mise registry entry, so 7-Zip writes it.
7zip = "26.06"
# PlantUML is a jar and needs a JVM. PlantUML also shells out to Graphviz,
# which has no mise registry entry: apt/dnf install graphviz, once per machine.
java = "temurin-21"

# Paths for the report and diagram tasks. Kept in [vars], not [env], so they do
# not leak into the environment of every other task.
[vars]
plantuml_version = "1.2025.4"
plantuml_jar = "{{env.HOME}}/.local/share/plantuml/plantuml.jar"
diagrams_dir = "{{config_root}}/docs/diagramas"
report_dir = "{{config_root}}/docs/informe"

###############################################################################
# Repo hygiene, diagrams and the report.
#
#   hooks:install   wire the git hooks (once per clone)
#   lint            every pre-commit hook over what this branch changed
#   diagrams:*      PlantUML sources in docs/diagramas/
#   report:*        the Typst report in docs/informe/
###############################################################################

[tasks."hooks:install"]
description = "Wires the pre-commit hooks into git (once per clone)"
run = "prek install"

[tasks.lint]
description = "Runs every pre-commit hook over the files this branch changed against origin/main"
# Not --all-files: some course files predate the hooks (no final newline, for
# one), and the fix belongs to whoever edits them, not to an unrelated branch.
# CI runs the same range.
run = "prek run --from-ref origin/main --to-ref HEAD"

[tasks."diagrams:fetch"]
description = "Downloads plantuml.jar into ~/.local/share/plantuml (once per machine)"
run = '''
set -eu
jar="{{vars.plantuml_jar}}"
version="{{vars.plantuml_version}}"

if [ -f "$jar" ]; then
    echo "PlantUML already at $jar"
    exit 0
fi

echo "Downloading PlantUML $version..."
mkdir -p "$(dirname "$jar")"
curl -fsSL -o "$jar" \
    "https://github.com/plantuml/plantuml/releases/download/v${version}/plantuml-${version}.jar"
echo "OK: $jar"
'''

[tasks.diagrams]
description = "Renders the .puml sources to SVG (for the report) and PNG"
depends = ["diagrams:fetch"]
sources = ["docs/diagramas/*.puml"]
outputs = ["docs/diagramas/*.svg", "docs/diagramas/*.png"]
run = '''
set -eu
dir="{{vars.diagrams_dir}}"

# PlantUML lays out everything except sequence diagrams through Graphviz.
# Without `dot` it still writes both output files — each containing a picture
# of a Java stack trace — and still exits 0, so a committed diagram is
# replaced by an error image and nothing says so. Refuse to run instead.
if ! command -v dot >/dev/null 2>&1; then
    echo "Graphviz is missing. PlantUML would overwrite the diagrams with an" >&2
    echo "error image and report success." >&2
    echo "Install it from the system package manager (apt/dnf install graphviz)." >&2
    exit 1
fi

set -- "$dir"/*.puml
if [ ! -e "$1" ]; then
    echo "No .puml sources in $dir"
    exit 0
fi

# PlantUML honours a single -t<format> per invocation: hence two passes.
java -jar "{{vars.plantuml_jar}}" -tsvg "$@"
java -jar "{{vars.plantuml_jar}}" -tpng "$@"

echo "Generated files:"
for f in "$dir"/*.svg "$dir"/*.png; do
    [ -f "$f" ] || continue
    echo "  $f"
done
'''

[tasks."diagrams:open"]
description = "Renders the diagrams and opens the SVGs in the browser"
depends = ["diagrams"]
run = '''
set -eu

opener="${BROWSER:-xdg-open}"
for svg in "{{vars.diagrams_dir}}"/*.svg; do
    [ -f "$svg" ] || continue
    echo "Opening $svg"
    "$opener" "file://$svg" >/dev/null 2>&1 &
done
wait
'''

[tasks.report]
description = "Compiles the report to PDF from the committed diagram renders"
# Deliberately does NOT depend on `diagrams`: PlantUML's layout changes with
# the Graphviz version, so re-rendering as a side effect of building the PDF
# could quietly swap a worse figure into the deliverable. Edit a .puml, run
# `mise run diagrams` yourself, and look at the result before committing it.
#
# `--root` is the repo so a section can reference a figure, a raw report or a
# piece of evidence by its path from the repo root.
sources = ["docs/informe/**/*.typ", "docs/informe/evidencia.yml", "docs/diagramas/*.svg"]
outputs = ["docs/informe/informe.pdf"]
run = '''
set -eu

typst compile --root "{{config_root}}" "{{vars.report_dir}}/informe.typ" "{{vars.report_dir}}/informe.pdf"
echo "Generated file:"
echo "  {{vars.report_dir}}/informe.pdf"
'''

[tasks."report:watch"]
description = "Re-renders the report on every save"
run = 'typst watch --root "{{config_root}}" "{{vars.report_dir}}/informe.typ" "{{vars.report_dir}}/informe.pdf"'

[tasks."report:open"]
description = "Compiles the report and opens the PDF"
depends = ["report"]
run = '''
set -eu

opener="${BROWSER:-xdg-open}"
echo "Opening {{vars.report_dir}}/informe.pdf"
"$opener" "file://{{vars.report_dir}}/informe.pdf" >/dev/null 2>&1 &
'''

[tasks."report:check"]
description = "Checks the page limit and every [E-NN] citation; `--final` also fails on #pendiente and uncited IDs"
# The checks the assignment grades on and nobody notices until it is late: a
# body over 30 pages is cut where it overflows, and a citation that points to
# nothing makes its whole section unsupported. See scripts/check-report.mjs.
usage = """
flag "--final" help="Treat #pendiente blocks and uncited evidence IDs as errors (run before delivery)"
"""
run = '''
set -eu

typst eval --root "{{config_root}}" --in "{{vars.report_dir}}/informe.typ" --format json '(
    evidencia: query(<evidencia>).first().value,
    citas: query(<cita-evidencia>).map(m => m.value),
    paginas: query(<paginas-cuerpo>).first().value,
    pendientes: query(<pendiente>).len(),
)' | REPO_ROOT="{{config_root}}" node "{{config_root}}/scripts/check-report.mjs" \
    $( [ "${usage_final:-false}" = true ] && echo --final )
'''

[settings]
pipx.uvx = true

[env]
# One tflint config for every stack and module.
TFLINT_CONFIG_FILE = "{{config_root}}/infra/.tflint.hcl"

###############################################################################
# Tasks. `mise tasks` lists them all.
#
# Each task is namespaced by the part of the repo it acts on:
#
#   infra:*     Terraform stacks under infra/envs/prd (foundation, then platform).
#               State and runs live in HCP Terraform: `terraform login` once per
#               machine. infra:bootstrap creates the workspaces (once per group)
#   ansible:*   software on the VMSS instances
#   app:*       the Node app in node/
#   perf:*      Artillery load tests in perf/
#
# `up` and `down` chain them for a full session.
###############################################################################

[tasks."infra:init"]
description = "Initializes a stack's backend and downloads the providers"
usage = 'arg "[stack]" default="foundation" { choices "foundation" "platform" "observability"; }'
run = 'terraform -chdir="infra/envs/prd/${usage_stack}" init'

[tasks."infra:bootstrap"]
description = "Creates the HCP Terraform workspaces and the Azure identity of their remote runs. Once per group, before the first infra:init"
run = '''
if [ ! -r infra/bootstrap/terraform.tfvars ]; then
  echo "Missing infra/bootstrap/terraform.tfvars. Copy terraform.tfvars.example next to it and fill it in." >&2
  exit 1
fi
terraform -chdir=infra/bootstrap init -input=false || exit 1
terraform -chdir=infra/bootstrap apply
'''

[tasks."infra:validate"]
description = "Validates every stack, bootstrap included"
run = '''
for dir in infra/bootstrap infra/envs/prd/foundation infra/envs/prd/platform infra/envs/prd/observability; do
  terraform -chdir="$dir" init -backend=false -input=false >/dev/null || exit 1
  terraform -chdir="$dir" validate || exit 1
done
'''

[tasks."infra:plan"]
description = "Shows a stack's plan"
usage = 'arg "[stack]" default="foundation" { choices "foundation" "platform" "observability"; }'
run = 'terraform -chdir="infra/envs/prd/${usage_stack}" plan'

[tasks."infra:apply"]
description = "Applies a stack. Apply foundation before platform"
usage = 'arg "[stack]" default="foundation" { choices "foundation" "platform" "observability"; }'
run = 'terraform -chdir="infra/envs/prd/${usage_stack}" apply'

[tasks."infra:destroy"]
description = "Destroys a stack. Destroy platform before foundation"
usage = 'arg "[stack]" default="platform" { choices "foundation" "platform" "observability"; }'
run = 'terraform -chdir="infra/envs/prd/${usage_stack}" destroy'

[tasks."infra:fmt"]
description = "Formats every Terraform file"
run = "terraform fmt -recursive infra"

[tasks."infra:lint"]
description = "Checks formatting and runs tflint on every stack and module"
run = '''
terraform fmt -check -recursive infra || exit 1
tflint --init
# Notices (like a retired VM size) are printed but don't fail the task.
tflint --chdir=infra --recursive --minimum-failure-severity=warning
'''

[tasks."ansible:setup"]
description = "Installs the Datadog agent, Node and pm2 on every VMSS instance. Export DATADOG_API_KEY and DATADOG_SITE first"
run = '''
ansible-galaxy collection install -r ansible/requirements.yml
ansible/setup.sh
'''

[tasks."app:install"]
description = "Installs the Node app's dependencies, exactly as node/package-lock.json pins them"
dir = "node"
run = "npm ci"

[tasks."app:test"]
description = "Runs the Node app's unit tests. They need no stack. Extra args go to node --test, e.g. --test-name-pattern=H-01"
dir = "node"
depends = ["app:install"]
run = "npm test --"

[tasks."app:zip"]
description = "Zips the Node app into node/src.zip, the same archive app:deploy ships"
run = "node/zip.sh"

[tasks."app:deploy"]
description = "Zips the Node app and deploys it to every VMSS instance"
run = "ansible/deploy.sh"

[tasks."perf:install"]
description = "Installs Artillery"
dir = "perf"
run = "npm ci"

[tasks."perf:run"]
description = "Runs an Artillery scenario against the load balancer. Export DATADOG_API_KEY and DATADOG_SITE first"
usage = '''
arg "<scenario>" help="Scenario file in perf/, without .yaml"
arg "<output>" help="Report path, without .json"
'''
dir = "perf"
run = './run.sh "${usage_scenario}" "${usage_output}"'

[tasks.up]
description = "Logs into Azure, applies foundation and platform in HCP Terraform, then installs and deploys the app. Applies without asking"
run = '''
# Checked before anything is created: ansible:setup needs them at the end.
if [ -z "${DATADOG_API_KEY:-}" ]; then
  echo "DATADOG_API_KEY is not set. Export your Datadog API key first." >&2
  exit 1
fi
if [ -z "${DATADOG_SITE:-}" ]; then
  echo "DATADOG_SITE is not set. Export your Datadog site first (e.g. us5.datadoghq.com)." >&2
  exit 1
fi

# The remote runs authenticate on their own. The local `az` session is for
# ansible/update_vmss_inventory.sh, which lists the VMSS instances.
echo "##### Logging into Azure #####"
az account show >/dev/null 2>&1 || az login || exit 1

for stack in foundation platform; do
  echo "##### Applying $stack #####"
  terraform -chdir="infra/envs/prd/$stack" init -input=false || exit 1
  terraform -chdir="infra/envs/prd/$stack" apply -auto-approve || exit 1
done

echo "##### Installing software on VMSS #####"
mise run ansible:setup || exit 1

echo "##### Deploying node app to VMSS #####"
mise run app:deploy || exit 1

echo "##### Finished #####"
'''

[tasks.down]
description = "Destroys platform, then foundation. Asks before each"
run = '''
for stack in platform foundation; do
  terraform -chdir="infra/envs/prd/$stack" init -input=false || exit 1
  terraform -chdir="infra/envs/prd/$stack" destroy || exit 1
done
'''
